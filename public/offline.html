<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tidak ada koneksi · Lajur</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f8;
        --fg: #1a1a1a;
        --muted: #62666e;
        --accent: #0069e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f5f5f5;
          --muted: #a3a3a3;
          --accent: #4c9bff;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Inline: the icon file can't load without a connection either. -->
      <svg viewBox="0 0 256 256" width="56" height="56" aria-hidden="true">
        <rect width="256" height="256" rx="57.6" fill="#0069E8" />
        <g transform="translate(22.14 22.14) scale(0.827)" fill="#fff">
          <rect x="48" y="32" width="64" height="192" rx="16" />
          <rect x="140" y="156" width="68" height="68" rx="16" />
        </g>
      </svg>
      <h1>Tidak ada koneksi internet</h1>
      <p>Lajur butuh internet untuk memuat lamaranmu. Cek koneksi, lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
